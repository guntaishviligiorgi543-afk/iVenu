<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | The Launch</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html"><span>home</span></a>
        <a href="shows.html"><span>shows</span></a>
        <a href="venue.html"><span>venue</span></a>
        <a href="contact.html"><span>contact</span></a>
      </nav>
      <a class="contact" href="contact.html"><span>the launch</span></a>
    </header>

    <main class="auth-page">
      <section class="auth-shell" aria-labelledby="forgot-title">
        <h1 id="forgot-title">recover</h1>
        <p class="auth-intro">
          Enter your email and we will send a secure reset link.
        </p>
        <form class="auth-form" id="forgotForm">
          <label>
            Email
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <button class="auth-submit" type="submit">Send reset link</button>
        </form>
        <p class="auth-message" id="authMessage" role="status"></p>
        <a class="auth-link" href="login.html">Back to login</a>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script>
      const form = document.querySelector("#forgotForm");
      const message = document.querySelector("#authMessage");
      const submit = form.querySelector("button");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.className = "auth-message";
        message.textContent = "Sending reset link...";
        submit.disabled = true;

        try {
          const email = new FormData(form).get("email");
          await window.authApi.requestPasswordReset(email);
          message.className = "auth-message success";
          message.textContent =
            "If an account exists for this email, a reset link has been sent.";
        } catch (error) {
          console.error(error);
          message.className = "auth-message error";
          message.textContent =
            "Unable to send the reset link. Please try again.";
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
