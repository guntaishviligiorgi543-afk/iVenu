<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | The Launch</title>
    <link rel="stylesheet" href="main.css" />
    <script src="loading-state.js"></script>
    <script defer src="public-header.js"></script>
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html"><span>home</span></a>
        <a href="shows.html"><span>shows</span></a>
        <a href="venue.html"><span>venue</span></a>
        <a href="contact.html"><span>contact</span></a>
      </nav>
      <a class="contact" href="contact.html"><span>the launch</span></a>
    </header>

    <main class="auth-page">
      <a class="auth-page-logo" href="index.html" aria-label="iVenue home">
        <img src="assets/ivenue-logo.png" alt="iVenue" />
      </a>
      <section class="auth-shell" aria-labelledby="forgot-title">
        <h1 id="forgot-title">recover</h1>
        <p class="auth-intro">
          Enter your email and we will send a secure recovery email.
        </p>
        <form class="auth-form" id="forgotForm">
          <label>
            Email
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <button class="auth-submit" id="sendRecovery" type="submit">
            Send recovery email
          </button>
        </form>
        <form class="auth-form" id="otpForm" hidden>
          <label>
            Verification code
            <input
              type="text"
              name="token"
              inputmode="numeric"
              autocomplete="one-time-code"
              pattern="[0-9]{8}"
              minlength="8"
              maxlength="8"
              required
            />
          </label>
          <button class="auth-submit" type="submit">Verify code</button>
          <button class="auth-link-button" id="resendCode" type="button">
            Resend code
          </button>
        </form>
        <form class="auth-form" id="passwordForm" hidden>
          <label>
            New password
            <input
              type="password"
              name="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </label>
          <label>
            Confirm new password
            <input
              type="password"
              name="confirmPassword"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </label>
          <button class="auth-submit" type="submit">Change password</button>
        </form>
        <p class="auth-message" id="authMessage" role="status"></p>
        <a class="auth-link" href="login.html">Back to login</a>
      </section>
    </main>
    <div class="password-success-dialog" id="passwordSuccessDialog" hidden>
      <div
        class="password-success-dialog__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="passwordSuccessTitle"
      >
        <h2 id="passwordSuccessTitle">Password changed successfully</h2>
        <p>Your password has been updated. You can now log in.</p>
        <a class="auth-submit" id="loginNow" href="login.html">Login now</a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script src="event-cart.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const adminMode = params.get("mode") === "admin";
      const form = document.querySelector("#forgotForm");
      const otpForm = document.querySelector("#otpForm");
      const passwordForm = document.querySelector("#passwordForm");
      const message = document.querySelector("#authMessage");
      const successDialog = document.querySelector("#passwordSuccessDialog");
      const loginNow = document.querySelector("#loginNow");
      const submit = form.querySelector("button[type=submit]");
      const resend = document.querySelector("#resendCode");
      const sendRecovery = document.querySelector("#sendRecovery");
      let email = "";
      let resendTimer = null;
      loginNow.href = adminMode ? "admin-login.html" : "login.html";
      if (!adminMode) {
        sendRecovery.textContent = "Send code";
        document.querySelector(".auth-intro").textContent =
          "Enter your email and we will send a secure verification code.";
      }

      function showMessage(text, type = "") {
        message.className = `auth-message ${type}`;
        message.textContent = text;
      }

      function showStep(step) {
        form.hidden = step !== "email";
        otpForm.hidden = step !== "otp";
        passwordForm.hidden = step !== "password";
      }

      function formatAuthError(error) {
        const details = [error?.message, error?.status, error?.code].filter(
          Boolean,
        );
        return details.length
          ? `Unable to send recovery email (${details.join(" · ")}).`
          : "Unable to send recovery email.";
      }

      function startCooldown(seconds = 60) {
        clearInterval(resendTimer);
        resend.disabled = true;
        let remaining = seconds;
        resend.textContent = `Resend code (${remaining}s)`;
        resendTimer = setInterval(() => {
          remaining -= 1;
          if (remaining <= 0) {
            clearInterval(resendTimer);
            resend.disabled = false;
            resend.textContent = "Resend code";
            return;
          }
          resend.textContent = `Resend code (${remaining}s)`;
        }, 1000);
      }

      async function verifyRecoveryAccess(userId) {
        const { data, error } = await window.supabaseClient
          .from("admin_users")
          .select("user_id")
          .eq("user_id", userId)
          .maybeSingle();
        if (error) throw error;
        return adminMode ? Boolean(data) : !data;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        showMessage("Sending verification code...");
        submit.disabled = true;

        try {
          email = window.authApi.normalizeEmail(
            new FormData(form).get("email"),
          );
          if (adminMode) {
            await window.authApi.requestAdminPasswordReset(email);
            showStep("email");
            showMessage(
              "A password recovery email was sent. Open its link to choose a new password.",
              "success",
            );
            submit.disabled = false;
            return;
          }
          await window.authApi.requestPasswordOtp(email);
          showStep("otp");
          showMessage("A verification code was sent to your email.", "success");
          startCooldown();
        } catch (error) {
          console.error(error);
          showMessage(
            adminMode
              ? formatAuthError(error)
              : error.message ||
                  "Unable to send the verification code. Please try again.",
            "error",
          );
          submit.disabled = false;
        }
      });

      otpForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const otpSubmit = otpForm.querySelector("button[type=submit]");
        const token = new FormData(otpForm).get("token");
        otpSubmit.disabled = true;
        showMessage("Verifying code...");
        try {
          const result = await window.authApi.verifyPasswordOtp(email, token);
          const user = result?.user;
          if (!user || !(await verifyRecoveryAccess(user.id))) {
            await window.authApi.signOut();
            throw new Error(
              "This account is not authorized for admin recovery.",
            );
          }
          showStep("password");
          showMessage("Code verified. Choose a new password.", "success");
        } catch (error) {
          console.error(error);
          showMessage(
            String(error.message || "")
              .toLowerCase()
              .includes("expired")
              ? "This code has expired. Request a new code."
              : error.message || "The code is incorrect. Please try again.",
            "error",
          );
          otpSubmit.disabled = false;
        }
      });

      resend.addEventListener("click", async () => {
        resend.disabled = true;
        try {
          await (adminMode
            ? window.authApi.requestAdminPasswordOtp(email)
            : window.authApi.requestPasswordOtp(email));
          showMessage("A new verification code was sent.", "success");
          startCooldown();
        } catch (error) {
          showMessage(error.message || "Unable to resend the code.", "error");
          resend.disabled = false;
        }
      });

      passwordForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const values = new FormData(passwordForm);
        const password = values.get("password");
        const passwordError = window.authApi.validatePassword(password);
        if (passwordError) return showMessage(passwordError, "error");
        if (password !== values.get("confirmPassword")) {
          return showMessage("Passwords must match.", "error");
        }

        const passwordSubmit = passwordForm.querySelector(
          "button[type=submit]",
        );
        passwordSubmit.disabled = true;
        showMessage("Changing password...");
        try {
          const user = await window.authApi.getUser();
          if (!user?.id || !(await verifyRecoveryAccess(user.id))) {
            throw new Error(
              "Your verified recovery session is no longer valid.",
            );
          }
          await window.authApi.updatePassword(password);
          passwordForm.reset();
          await window.authApi.signOut();
          successDialog.hidden = false;
          loginNow.focus();
        } catch (error) {
          console.error(error);
          showMessage(
            error.message || "Unable to change the password.",
            "error",
          );
          passwordSubmit.disabled = false;
        }
      });
    </script>
  </body>
</html>
