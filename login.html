<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="images/facicon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <title>Sign In | iVenue</title>
    <meta name="description" content="Sign in to your iVenue account to manage your tickets, reservations, cart, and account." />
    <link rel="canonical" href="https://ivenue.site/login.html" />
    <link rel="stylesheet" href="main.css" />
    <script src="loading-state.js"></script>
    <script defer src="public-header.js"></script>
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="auth-login-page">
    <header>
      <nav>
        <a href="index.html"><span>home</span></a>
        <a href="shows.html"><span>shows</span></a>
        <a href="venue.html"><span>venue</span></a>
        <a href="contact.html"><span>contact</span></a>
      </nav>
      <a class="auth-page-logo" href="index.html" aria-label="iVenue home">
        <img src="assets/ivenue-logo.png" alt="iVenue" />
      </a>
    </header>

    <main class="auth-page">
      <section class="auth-shell" aria-labelledby="login-title">
        <h1 id="login-title">login</h1>
        <p class="auth-intro">Sign in to manage your tickets and orders.</p>

        <form class="auth-form" id="loginForm">
          <label>
            Email
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <label>
            Password
            <input
              type="password"
              name="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button class="auth-submit" type="submit">Sign in</button>
          <div class="social-auth" aria-label="Social sign-in options">
            <div class="social-auth__divider" aria-hidden="true"><span>OR</span></div>
            <button class="social-auth-btn google-auth-btn" type="button" aria-label="Continue with Google">
              <svg class="social-auth-btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.35 12.18c0-.64-.06-1.25-.16-1.84H12v3.48h5.26a4.49 4.49 0 0 1-1.95 2.95v2.26h3.16c1.85-1.7 2.88-4.21 2.88-7.2Z"/><path fill="#34A853" d="M12 21.72c2.64 0 4.86-.87 6.48-2.37l-3.16-2.26c-.88.59-2 .94-3.32.94-2.55 0-4.71-1.72-5.48-4.03H3.26v2.33A9.79 9.79 0 0 0 12 21.72Z"/><path fill="#FBBC05" d="M6.52 14c-.2-.59-.32-1.23-.32-1.89s.12-1.3.32-1.89V7.89H3.26A9.72 9.72 0 0 0 2.28 12c0 1.57.38 3.05.98 4.11L6.52 14Z"/><path fill="#EA4335" d="M12 6.2c1.44 0 2.73.5 3.75 1.48l2.81-2.81C16.85 3.28 14.64 2.28 12 2.28a9.79 9.79 0 0 0-8.74 5.61l3.26 2.33C7.29 7.92 9.45 6.2 12 6.2Z"/></svg>
              <span>Continue with Google</span>
            </button>
            <button class="social-auth-btn facebook-auth-btn social-auth-btn--not-released" type="button" aria-label="Continue with Facebook">
              <svg class="social-auth-btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.03 1.79-4.7 4.53-4.7 1.31 0 2.69.24 2.69.24v2.97h-1.52c-1.5 0-1.97.94-1.97 1.9v2.28h3.35l-.54 3.49h-2.81V24C19.61 23.1 24 18.1 24 12.07Z"/></svg>
              <span>Continue with Facebook</span>
            </button>
          </div>
        </form>

        <p class="auth-message" id="authMessage" role="status"></p>
        <a class="auth-link" href="forgot-password.html">Forgot password?</a>
        <a class="auth-link" href="register.html">Create an account</a>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script src="event-cart.js"></script>
    <script src="password-toggle.js"></script>
    <script>
      const form = document.querySelector("#loginForm");
      const message = document.querySelector("#authMessage");
      const submit = form.querySelector("button");
      const googleButton = form.querySelector(".google-auth-btn");
      const facebookButton = form.querySelector(".facebook-auth-btn");

      googleButton.addEventListener("click", async () => {
        if (googleButton.disabled) return;
        googleButton.disabled = true;
        message.className = "auth-message";
        message.textContent = "Redirecting to Google...";
        try {
          await window.authApi.signInWithGoogle();
        } catch (error) {
          console.error(error);
          message.className = "auth-message error";
          message.textContent = error.message || "Unable to start Google sign-in.";
          googleButton.disabled = false;
        }
      });

      facebookButton.addEventListener("click", async () => {
        if (facebookButton.disabled) return;
        facebookButton.disabled = true;
        message.className = "auth-message";
        message.textContent = "Redirecting to Facebook...";
        try {
          await window.authApi.signInWithFacebook();
        } catch (error) {
          console.error(error);
          message.className = "auth-message error";
          message.textContent = error.message || "Unable to start Facebook sign-in.";
          facebookButton.disabled = false;
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.className = "auth-message";
        message.textContent = "Signing in...";
        submit.disabled = true;

        try {
          const formData = new FormData(form);
          await window.authApi.signIn(
            formData.get("email").trim(),
            formData.get("password"),
          );
          window.location.href = "index.html";
        } catch (error) {
          message.className = "auth-message error";
          const errorText = String(error.message || "").toLowerCase();
          message.textContent = errorText.includes("email not confirmed")
            ? "Please verify your email before signing in."
            : error.message || "Unable to sign in.";
          if (errorText.includes("email not confirmed")) {
            const verifyLink = document.createElement("a");
            verifyLink.className = "auth-link";
            verifyLink.href = `verify-email.html?email=${encodeURIComponent(window.authApi.normalizeEmail(formData.get("email")))}`;
            verifyLink.textContent = "Enter verification code";
            message.append(" ", verifyLink);
          }
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
