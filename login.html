<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | The Launch</title>
    <link rel="stylesheet" href="main.css" />
    <script defer src="public-header.js"></script>
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="auth-login-page">
    <header>
      <nav>
        <a href="index.html"><span>home</span></a>
        <a href="shows.html"><span>shows</span></a>
        <a href="venue.html"><span>venue</span></a>
        <a href="contact.html"><span>contact</span></a>
      </nav>
      <a class="auth-home-brand" href="index.html">iVenue</a>
    </header>

    <main class="auth-page">
      <section class="auth-shell" aria-labelledby="login-title">
        <h1 id="login-title">login</h1>
        <p class="auth-intro">Sign in to manage your tickets and orders.</p>

        <form class="auth-form" id="loginForm">
          <label>
            Email
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <label>
            Password
            <input
              type="password"
              name="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button class="auth-submit" type="submit">Sign in</button>
        </form>

        <p class="auth-message" id="authMessage" role="status"></p>
        <a class="auth-link" href="forgot-password.html">Forgot password?</a>
        <a class="auth-link" href="register.html">Create an account</a>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script src="event-cart.js"></script>
    <script src="password-toggle.js"></script>
    <script>
      const form = document.querySelector("#loginForm");
      const message = document.querySelector("#authMessage");
      const submit = form.querySelector("button");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.className = "auth-message";
        message.textContent = "Signing in...";
        submit.disabled = true;

        try {
          const formData = new FormData(form);
          await window.authApi.signIn(
            formData.get("email").trim(),
            formData.get("password"),
          );
          window.location.href = "index.html";
        } catch (error) {
          message.className = "auth-message error";
          const errorText = String(error.message || "").toLowerCase();
          message.textContent = errorText.includes("email not confirmed")
            ? "Please verify your email before signing in."
            : error.message || "Unable to sign in.";
          if (errorText.includes("email not confirmed")) {
            const verifyLink = document.createElement("a");
            verifyLink.className = "auth-link";
            verifyLink.href = `verify-email.html?email=${encodeURIComponent(window.authApi.normalizeEmail(formData.get("email")))}`;
            verifyLink.textContent = "Enter verification code";
            message.append(" ", verifyLink);
          }
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
