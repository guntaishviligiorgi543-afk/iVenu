<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="images/facicon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Register | iVenue</title>
    <link rel="stylesheet" href="main.css" />
    <script src="loading-state.js"></script>
    <script defer src="public-header.js"></script>
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="auth-register-page">
    <header>
      <nav>
        <a href="index.html"><span>home</span></a>
        <a href="shows.html"><span>shows</span></a>
        <a href="venue.html"><span>venue</span></a>
        <a href="contact.html"><span>contact</span></a>
      </nav>
      <a class="auth-page-logo" href="index.html" aria-label="iVenue home">
        <img src="assets/ivenue-logo.png" alt="iVenue" />
      </a>
    </header>

    <main class="auth-page">
      <section class="auth-shell" aria-labelledby="register-title">
        <h1 id="register-title">register</h1>
        <p class="auth-intro">Create your account for faster checkout.</p>

        <form class="auth-form" id="registerForm" novalidate>
          <label>
            <span class="field-label"
              >First name <span class="required-mark">*</span></span
            >
            <input
              type="text"
              name="firstName"
              autocomplete="given-name"
              required
            />
            <span class="field-error" data-field-error="firstName"></span>
          </label>
          <label>
            <span class="field-label"
              >Last name <span class="required-mark">*</span></span
            >
            <input
              type="text"
              name="lastName"
              autocomplete="family-name"
              required
            />
            <span class="field-error" data-field-error="lastName"></span>
          </label>
          <label>
            <span class="field-label"
              >Email <span class="required-mark">*</span></span
            >
            <input type="email" name="email" autocomplete="email" required />
            <span class="field-error" data-field-error="email"></span>
          </label>
          <label>
            <span class="field-label"
              >Phone <span class="required-mark">*</span></span
            >
            <span class="phone-input-group">
              <select
                id="phoneCountry"
                aria-label="Country calling code"
                required
              >
                <option value="GE" selected>GE +995</option>
                <option value="US">US +1</option>
                <option value="GB">GB +44</option>
                <option value="DE">DE +49</option>
                <option value="FR">FR +33</option>
                <option value="ES">ES +34</option>
                <option value="IT">IT +39</option>
                <option value="TR">TR +90</option>
                <option value="AM">AM +374</option>
                <option value="AZ">AZ +994</option>
                <option value="UA">UA +380</option>
                <option value="PL">PL +48</option>
              </select>
              <input
                type="tel"
                name="phone"
                autocomplete="tel"
                inputmode="tel"
                required
              />
            </span>
            <span class="field-error" data-field-error="phone"></span>
          </label>
          <label>
            <span class="field-label"
              >Password <span class="required-mark">*</span></span
            >
            <input
              type="password"
              name="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
            <span class="field-error" data-field-error="password"></span>
          </label>
          <label>
            <span class="field-label"
              >Confirm password <span class="required-mark">*</span></span
            >
            <input
              type="password"
              name="confirmPassword"
              minlength="8"
              autocomplete="new-password"
              required
            />
            <span class="field-error" data-field-error="confirmPassword"></span>
          </label>
          <button class="auth-submit" type="submit">Create account</button>
          <div class="social-auth" aria-label="Social sign-up options">
            <div class="social-auth__divider" aria-hidden="true"><span>OR</span></div>
            <button class="social-auth-btn google-auth-btn" type="button" aria-label="Continue with Google">
              <svg class="social-auth-btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.35 12.18c0-.64-.06-1.25-.16-1.84H12v3.48h5.26a4.49 4.49 0 0 1-1.95 2.95v2.26h3.16c1.85-1.7 2.88-4.21 2.88-7.2Z"/><path fill="#34A853" d="M12 21.72c2.64 0 4.86-.87 6.48-2.37l-3.16-2.26c-.88.59-2 .94-3.32.94-2.55 0-4.71-1.72-5.48-4.03H3.26v2.33A9.79 9.79 0 0 0 12 21.72Z"/><path fill="#FBBC05" d="M6.52 14c-.2-.59-.32-1.23-.32-1.89s.12-1.3.32-1.89V7.89H3.26A9.72 9.72 0 0 0 2.28 12c0 1.57.38 3.05.98 4.11L6.52 14Z"/><path fill="#EA4335" d="M12 6.2c1.44 0 2.73.5 3.75 1.48l2.81-2.81C16.85 3.28 14.64 2.28 12 2.28a9.79 9.79 0 0 0-8.74 5.61l3.26 2.33C7.29 7.92 9.45 6.2 12 6.2Z"/></svg>
              <span>Continue with Google</span>
            </button>
            <button class="social-auth-btn facebook-auth-btn social-auth-btn--not-released" type="button" aria-label="Continue with Facebook">
              <svg class="social-auth-btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.03 1.79-4.7 4.53-4.7 1.31 0 2.69.24 2.69.24v2.97h-1.52c-1.5 0-1.97.94-1.97 1.9v2.28h3.35l-.54 3.49h-2.81V24C19.61 23.1 24 18.1 24 12.07Z"/></svg>
              <span>Continue with Facebook</span>
            </button>
          </div>
        </form>

        <p class="auth-message" id="authMessage" role="status"></p>
        <a class="auth-link" href="login.html">Already have an account?</a>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script src="event-cart.js"></script>
    <script src="password-toggle.js"></script>
    <script>
      const form = document.querySelector("#registerForm");
      const message = document.querySelector("#authMessage");
      const submit = form.querySelector("button");
      const googleButton = form.querySelector(".google-auth-btn");
      const facebookButton = form.querySelector(".facebook-auth-btn");
      const fields = Object.fromEntries(
        [
          "firstName",
          "lastName",
          "email",
          "phone",
          "password",
          "confirmPassword",
        ].map((name) => [name, form.elements[name]]),
      );
      const fieldErrors = Object.fromEntries(
        Object.keys(fields).map((name) => [
          name,
          form.querySelector(`[data-field-error="${name}"]`),
        ]),
      );
      const touchedFields = new Set();
      const phoneCountry = document.querySelector("#phoneCountry");
      const phoneRules = {
        GE: {
          dialCode: "+995",
          pattern: /^5\d{8}$/,
          placeholder: "555 12 34 56",
        },
        US: {
          dialCode: "+1",
          pattern: /^[2-9]\d{9}$/,
          placeholder: "555 123 4567",
        },
        GB: {
          dialCode: "+44",
          pattern: /^\d{9,10}$/,
          placeholder: "7700 900123",
        },
        DE: {
          dialCode: "+49",
          pattern: /^\d{7,11}$/,
          placeholder: "151 23456789",
        },
        FR: {
          dialCode: "+33",
          pattern: /^\d{9}$/,
          placeholder: "6 12 34 56 78",
        },
        ES: {
          dialCode: "+34",
          pattern: /^[6-9]\d{8}$/,
          placeholder: "612 345 678",
        },
        IT: {
          dialCode: "+39",
          pattern: /^\d{6,11}$/,
          placeholder: "312 345 6789",
        },
        TR: {
          dialCode: "+90",
          pattern: /^\d{10}$/,
          placeholder: "532 123 4567",
        },
        AM: { dialCode: "+374", pattern: /^\d{8}$/, placeholder: "91 123456" },
        AZ: {
          dialCode: "+994",
          pattern: /^\d{9}$/,
          placeholder: "50 123 45 67",
        },
        UA: {
          dialCode: "+380",
          pattern: /^\d{9}$/,
          placeholder: "50 123 45 67",
        },
        PL: { dialCode: "+48", pattern: /^\d{9}$/, placeholder: "512 345 678" },
      };

      googleButton.addEventListener("click", async () => {
        if (googleButton.disabled) return;
        googleButton.disabled = true;
        message.className = "auth-message";
        message.textContent = "Redirecting to Google...";
        try {
          await window.authApi.signInWithGoogle();
        } catch (error) {
          console.error(error);
          message.className = "auth-message error";
          message.textContent = error.message || "Unable to start Google sign-in.";
          googleButton.disabled = false;
        }
      });

      facebookButton.addEventListener("click", async () => {
        if (facebookButton.disabled) return;
        facebookButton.disabled = true;
        message.className = "auth-message";
        message.textContent = "Redirecting to Facebook...";
        try {
          await window.authApi.signInWithFacebook();
        } catch (error) {
          console.error(error);
          message.className = "auth-message error";
          message.textContent = error.message || "Unable to start Facebook sign-in.";
          facebookButton.disabled = false;
        }
      });

      const getLocalPhoneDigits = () => {
        const digits = String(fields.phone.value || "").replace(/\D/g, "");
        const rule = phoneRules[phoneCountry.value];
        const dialDigits = rule?.dialCode.replace(/\D/g, "") || "";
        return dialDigits && digits.startsWith(dialDigits)
          ? digits.slice(dialDigits.length)
          : digits;
      };

      const getNormalizedPhone = () => {
        const rule = phoneRules[phoneCountry.value];
        return rule ? `${rule.dialCode}${getLocalPhoneDigits()}` : "";
      };

      const getFieldError = (name, forceRequired = false) => {
        const value = String(fields[name].value || "");
        const isEmpty = !value.trim();
        if (name === "firstName")
          return isEmpty
            ? forceRequired
              ? "Please enter your first name."
              : ""
            : "";
        if (name === "lastName")
          return isEmpty
            ? forceRequired
              ? "Please enter your last name."
              : ""
            : "";
        if (name === "email")
          return isEmpty
            ? forceRequired
              ? "Please enter your email address."
              : ""
            : /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim())
              ? ""
              : "Please enter a valid email address.";
        if (name === "phone") {
          const rule = phoneRules[phoneCountry.value];
          return isEmpty
            ? forceRequired
              ? "Please enter your phone number."
              : ""
            : rule && rule.pattern.test(getLocalPhoneDigits())
              ? ""
              : "Please enter a valid phone number for the selected country.";
        }
        if (name === "password")
          return isEmpty
            ? forceRequired
              ? "Please enter your password."
              : ""
            : window.authApi.validatePassword(value);
        if (name === "confirmPassword")
          return isEmpty
            ? forceRequired
              ? "Please confirm your password."
              : ""
            : value === fields.password.value
              ? ""
              : "Passwords must match.";
        return "";
      };

      const validateField = (name, force = false) => {
        if (!force && !touchedFields.has(name)) return true;
        const error = getFieldError(name, force);
        fields[name].classList.toggle("invalid", Boolean(error));
        fields[name].setAttribute("aria-invalid", String(Boolean(error)));
        fieldErrors[name].textContent = error;
        return !error;
      };

      Object.entries(fields).forEach(([name, field]) => {
        const validate = () => validateField(name);
        field.addEventListener("input", () => {
          touchedFields.add(name);
          validate();
          if (name === "password" && fields.confirmPassword.value.trim()) {
            validateField("confirmPassword");
          }
        });
        field.addEventListener("blur", () => {
          touchedFields.add(name);
          validate();
        });
        field.addEventListener("change", () => {
          touchedFields.add(name);
          validate();
        });
      });

      phoneCountry.addEventListener("change", () => {
        fields.phone.placeholder =
          phoneRules[phoneCountry.value]?.placeholder || "";
        if (fields.phone.value.trim()) {
          touchedFields.add("phone");
          validateField("phone");
        }
      });

      const validateForm = () => {
        let invalidField = null;
        Object.keys(fields).forEach((name) => {
          touchedFields.add(name);
          if (!validateField(name, true) && !invalidField) invalidField = name;
        });
        if (invalidField) {
          if (invalidField === "phone" && !phoneCountry.value)
            phoneCountry.focus();
          else fields[invalidField].focus();
        }
        return !invalidField;
      };

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!validateForm()) return;
        const formData = new FormData(form);
        const password = formData.get("password");
        const confirmPassword = formData.get("confirmPassword");
        const phone = getNormalizedPhone();

        const passwordError = window.authApi.validatePassword(password);
        if (passwordError) {
          message.className = "auth-message error";
          message.textContent = passwordError;
          return;
        }

        if (password !== confirmPassword) {
          message.className = "auth-message error";
          message.textContent = "Passwords must match.";
          return;
        }

        message.className = "auth-message";
        message.textContent = "Creating account...";
        submit.disabled = true;

        try {
          const result = await window.authApi.signUp({
            firstName: formData.get("firstName").trim(),
            lastName: formData.get("lastName").trim(),
            email: formData.get("email").trim(),
            phone,
            password,
          });

          if (result.duplicateEmail) {
            throw new Error(
              "An account with this email already exists. Please log in or reset your password.",
            );
          }

          message.className = "auth-message success";
          message.textContent =
            "Account created. Enter the verification code sent to your email.";
          window.location.href = `verify-email.html?email=${encodeURIComponent(result.profile.email)}`;
        } catch (error) {
          message.className = "auth-message error";
          const errorText = String(error.message || "").toLowerCase();
          message.textContent =
            errorText.includes("already registered") ||
            errorText.includes("already exists")
              ? "An account with this email already exists. Please log in or reset your password."
              : errorText.includes("email rate limit")
                ? "Too many email requests. Please wait and try again."
                : error.message || "Unable to create your account.";
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
