<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unsubscribe | iVenue</title><link rel="stylesheet" href="main.css"></head><body><main class="legal-page"><h1>Newsletter preferences</h1><p id="unsubscribeStatus">Updating your subscription…</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const token=new URLSearchParams(location.search).get('token');const status=document.querySelector('#unsubscribeStatus');if(!token){status.textContent='This unsubscribe link is invalid.'}else{window.supabaseClient.functions.invoke('newsletter-unsubscribe',{body:{token}}).then(({data,error})=>status.textContent=error||data?.error?'This unsubscribe link is invalid or has expired.':'You have been unsubscribed.').catch(()=>status.textContent='Something went wrong. Please try again.');}</script></body></html>
