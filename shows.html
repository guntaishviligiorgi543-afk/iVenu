<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> iVenue</title>

  <style>
    section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .calendarCont {
      display: flex;
      flex-direction: column;
      margin: 0 auto;
      margin-top: 100px;
      min-height: fit-content;
      width: min(900px, 100%);
      max-width: 100%;
      box-sizing: border-box;
    }
    .calendar {
      display: flex;
      align-self: flex-start;
    }
    .calendar-title {
      position: relative;
      display: flex;
      align-items: center;
      width: min(632px, 90vw);
      height: 116px;
      margin: 0 auto;
      overflow: hidden;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: clamp(2.8rem, 4.2vw, 3.7rem);
      font-weight: 400;
      line-height: 1;
      text-transform: uppercase;
    }

    .calendar-title__text {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      flex: 0 0 309px;
      width: 309px;
      height: 116px;
      padding-left: 74px;
      color: #000;
      background: #fefefe;
      justify-items: flex-end;
      white-space: nowrap;
    }

    .calendar-title__color {
      flex: 0 0 295px;
      width: 295px;
      height: 65px;
      background: #ff9475;
    }

    .calendar-title__pattern {
      flex: 0 0 28px;
      width: 28px;
      height: 65px;
      background: repeating-linear-gradient(65deg, #000 0 2px, #ff9475 2px 4px);
    }
    .calendar-title::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 17px;
      width: 100px;
      height: 9px;
      background: #fff;
    }
    .eventCards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding-top: 50px;
      height: fit-content;
    }

    .eventFilters {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(180px, 1fr);
      gap: 12px;
      width: min(100%, 900px);
      margin: 34px auto 0;
      font-family: "Cabin", sans-serif;
    }

    .eventFilters input,
    .eventFilters select {
      width: 100%;
      min-height: 44px;
      padding: 10px 13px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 0;
      color: #fff;
      background: #111;
      font: inherit;
      outline: none;
    }

    .eventFilters input:focus,
    .eventFilters select:focus {
      border-color: #ff9475;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 42px 0 20px;
    }

    .pagination button {
      min-width: 42px;
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid #ff9475;
      color: #ff9475;
      font: inherit;
      cursor: pointer;
    }

    .pagination button:hover,
    .pagination button.active {
      color: #000;
      background: #ff9475;
    }

    .pagination button:disabled {
      cursor: not-allowed;
      opacity: 0.35;
    }
    .vntCrd {
      position: relative;
      height: 55vh;
      color: #fff;
      overflow: hidden;
      padding: 5px;
      overflow: hidden;
    }

    .cardContent {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      justify-content: space-between;
      transition: 0.3s ease;
    }
    .eventCardImage {
      width: 100%;
      height: 50%;
      position: relative;
      overflow: hidden;
    }
    .eventCardImage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .vntCrd:hover img {
      transform: scale(1.1);
    }
    .eventCardShareButton {
      position: absolute;
      right: 14px;
      bottom: 14px;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 50%;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      cursor: pointer;
      opacity: 0;
      transform: translateY(8px);
      transition:
        opacity 0.22s ease,
        transform 0.22s ease,
        color 0.22s ease,
        background 0.22s ease;
    }
    .eventCardShareButton:hover,
    .eventCardShareButton:focus-visible {
      color: #ff9475;
      background: rgba(0, 0, 0, 0.76);
      outline: none;
    }
    .vntCrd:hover .eventCardShareButton,
    .eventCardShareButton:focus-visible {
      opacity: 1;
      transform: translateY(0);
    }
    @media (hover: none), (pointer: coarse) {
      .eventCardShareButton {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .moreInfoBtn {
      color: #fff;
      text-decoration: underline;
      text-transform: capitalize;
      font-size: 17px;
    }
    .cardContent:hover img {
      filter: brightness(1);
    }
    .bandNam {
      font-size: 2rem;
      text-align: center;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    }
    .concertDate {
      text-align: center;
      font-size: 15px;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    }
    .getTicketBtn {
      text-transform: uppercase;
    }
    .infoCont {
      position: absolute;
      inset: 0;
      padding: 14px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;

      font-family: "Courier New", Courier, monospace;

      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: 0.3s ease;

      background-color: rgb(0, 0, 0);

      overflow: hidden;
    }

    .infoScroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;

      display: flex;
      flex-direction: column;
      gap: 15px;

      padding-right: 5px;
    }

    .infoCont .getTicketBtn {
      flex-shrink: 0;
      width: fit-content;
      margin-top: auto;
      text-transform: uppercase;
    }

    .infoScroll::-webkit-scrollbar {
      width: 0;
    }

    .closeInf {
      font-size: 20px;
      transition: all 0.2s ease-in-out;
      padding: 4px;
      flex-shrink: 0;
    }

    .closeInf:hover {
      background-color: #ff9475;
      color: #000;
    }

    .vntCrd.showInfo .cardContent {
      opacity: 0;
      visibility: hidden;
    }

    .vntCrd.showInfo .infoCont {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .getTicketBtn {
      width: fit-content;
    }

    .eventsMessage {
      grid-column: 1 / -1;
      margin: 0;
      padding: 32px 16px;
      color: #fff;
      text-align: center;
      font-family: "Cabin", sans-serif;
    }

    .event-card-skeleton {
      pointer-events: none;
    }

    .event-card-skeleton .cardContent {
      align-items: stretch;
      gap: 20px;
    }

    .event-card-skeleton__media {
      width: 100%;
      height: 50%;
    }

    .event-card-skeleton__text {
      display: grid;
      gap: 12px;
    }

    .event-card-skeleton__button {
      width: 45%;
      height: 40px;
    }

    @media (max-width: 768px) {
      .eventFilters {
        grid-template-columns: 1fr;
        margin-top: 24px;
      }

      .eventCards {
        grid-template-columns: 1fr;
        padding-top: 30px;
      }
    }
  </style>

    <script>
      const eventCards = document.querySelector(".eventCards");
      const pagination = document.querySelector(".pagination");
      const eventSearch = document.querySelector("#eventSearch");
      const eventCategory = document.querySelector("#eventCategory");
      const releaseShowsInitialLoad = window.pageLoading?.lock("shows-first-section");
      const EVENTS_PER_PAGE = window.iVenueEventListing.pageSize;
      let loadedEvents = [];
      let filteredEvents = [];
      let currentPage = 1;

      function showEventsMessage(message, isError = false) {
        eventCards.innerHTML = `<p class="eventsMessage${isError ? " error" : ""}">${message}</p>`;
      }

      function showEventSkeletons() {
        eventCards.innerHTML = "";
        pagination.innerHTML = "";
        for (let index = 0; index < EVENTS_PER_PAGE; index += 1) {
          const skeleton = document.createElement("div");
          skeleton.className = "vntCrd event-card-skeleton";
          skeleton.setAttribute("aria-hidden", "true");
          skeleton.innerHTML = `<div class="cardContent"><div class="skeletonBlock event-card-skeleton__media"></div><div class="event-card-skeleton__text"><span class="skeletonBlock skeletonTextLine skeletonTextLine--wide"></span><span class="skeletonBlock skeletonTextLine"></span></div><span class="skeletonBlock event-card-skeleton__button"></span></div>`;
          eventCards.append(skeleton);
        }
      }

      function formatEventTime(value) {
        return value ? value.slice(0, 5) : "Time TBA";
      }

      function renderEventCard(event) {
        const band = event.bands || {};
        const performer = event.performer || band.name || event.title;
        const location = window.supabaseData.getEventLocation(event);
        const card = document.createElement("div");

        card.classList.add("vntCrd");

        card.innerHTML = `
    <div class="cardContent">

      <div class="eventCardImage">
        <img src="${event.image_url || band.image_url || ""}" alt="${performer}" />
        <button class="eventCardShareButton" type="button" data-show-share-event="${event.id}" aria-label="Share this event">
          <svg xmlns="http://www.w3.org/2000/svg" width="1.69em" height="1.5em" viewBox="0 0 1792 1600" aria-hidden="true">
            <path d="M0 0h1792v1600H0z" fill="none" />
            <path fill="currentColor" d="M1792 576q0 26-19 45l-512 512q-19 19-45 19t-45-19t-19-45V832H928q-98 0-175.5 6t-154 21.5t-133 42.5T360 971.5t-80 101t-48.5 138.5t-17.5 181q0 55 5 123q0 6 2.5 23.5t2.5 26.5q0 15-8.5 25t-23.5 10q-16 0-28-17q-7-9-13-22t-13.5-30t-10.5-24Q0 1222 0 1056q0-199 53-333q162-403 875-403h224V64q0-26 19-45t45-19t45 19l512 512q19 19 19 45" />
          </svg>
        </button>
      </div>

      <div>
        <p class="bandNam">${performer}</p>
        <p class="concertDate">${event.event_date}</p>
      </div>

      <button class="moreInfoBtn">more info</button>
 <button class="getTicketBtn" data-id="${event.id}">
  get tickets
</button>
    </div>

 <div class="infoCont">

  <span class="closeInf">X</span>

  <div class="infoScroll">

    <div>
      <h2>${event.title}</h2>
      <p>${event.event_date} — ${formatEventTime(event.event_time)}</p>
    </div>

    <p>${event.description || "Event details coming soon."}</p>

    <p>
      Doors open: ${formatEventTime(event.doors_open)}
    </p>

    <p>
      ${location.venue}<br>
      ${location.details}
    </p>

 <button class="getTicketBtn" data-id="${event.id}">
  get tickets
</button>
 
</div>
   `;

        eventCards.appendChild(card);
      }

      function renderPagination() {
        if (!pagination) return;
        const pageCount = Math.ceil(filteredEvents.length / EVENTS_PER_PAGE);
        pagination.innerHTML = "";
        if (pageCount <= 1) return;

        const previous = document.createElement("button");
        previous.type = "button";
        previous.textContent = "prev";
        previous.disabled = currentPage === 1;
        previous.addEventListener("click", () => {
          currentPage -= 1;
          renderPage();
        });
        pagination.appendChild(previous);

        for (let page = 1; page <= pageCount; page += 1) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = page;
          button.classList.toggle("active", page === currentPage);
          button.setAttribute("aria-label", `Page ${page}`);
          button.addEventListener("click", () => {
            currentPage = page;
            renderPage();
          });
          pagination.appendChild(button);
        }

        const next = document.createElement("button");
        next.type = "button";
        next.textContent = "next";
        next.disabled = currentPage === pageCount;
        next.addEventListener("click", () => {
          currentPage += 1;
          renderPage();
        });
        pagination.appendChild(next);
      }

      function renderPage() {
        const pageCount = Math.max(
          1,
          Math.ceil(filteredEvents.length / EVENTS_PER_PAGE),
        );
        currentPage = Math.min(currentPage, pageCount);
        const start = (currentPage - 1) * EVENTS_PER_PAGE;
        eventCards.innerHTML = "";
        if (!filteredEvents.length) {
          showEventsMessage("No results found");
          renderPagination();
          return;
        }
        filteredEvents
          .slice(start, start + EVENTS_PER_PAGE)
          .forEach(renderEventCard);
        bindEventCardInteractions();
        renderPagination();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function getEventCategory(event) {
        return event.categories?.name || "Uncategorized";
      }

      function fillCategoryFilter() {
        const categories = [
          ...new Set(loadedEvents.map(getEventCategory).filter(Boolean)),
        ].sort((first, second) => first.localeCompare(second));
        eventCategory.innerHTML = '<option value="">All categories</option>';
        categories.forEach((category) => {
          const option = document.createElement("option");
          option.value = category;
          option.textContent = category;
          eventCategory.appendChild(option);
        });
      }

      function applyEventFilters() {
        const searchTerm = eventSearch.value.trim().toLowerCase();
        const selectedCategory = eventCategory.value;
        filteredEvents = loadedEvents.filter((event) => {
          const name =
            `${event.title || ""} ${event.performer || ""} ${event.bands?.name || ""}`.toLowerCase();
          return (
            (!searchTerm || name.includes(searchTerm)) &&
            (!selectedCategory || getEventCategory(event) === selectedCategory)
          );
        });
        currentPage = 1;
        renderPage();
      }

      eventSearch.addEventListener("input", applyEventFilters);
      eventCategory.addEventListener("change", applyEventFilters);
      eventCards.addEventListener("click", (clickEvent) => {
        const shareButton = clickEvent.target.closest(
          "[data-show-share-event]",
        );
        if (!shareButton) return;
        clickEvent.preventDefault();
        clickEvent.stopPropagation();
        const event = loadedEvents.find(
          (item) => item.id === shareButton.dataset.showShareEvent,
        );
        window.iVenueEventShare?.open(event, shareButton);
      });

      async function loadEvents() {
        showEventSkeletons();

        try {
          const events = await window.supabaseData.getEvents();

          if (!events.length) {
            showEventsMessage("No events are available right now.");
            return;
          }

          loadedEvents = events;
          fillCategoryFilter();
          filteredEvents = loadedEvents;
          currentPage = 1;
          renderPage();
        } catch (error) {
          console.error(error);
          showEventsMessage("Events are temporarily unavailable.", true);
        } finally {
          releaseShowsInitialLoad?.();
        }
      }
    </script>

    <script>
      function bindEventCardInteractions() {
        document.querySelectorAll(".moreInfoBtn").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();

            const card = btn.closest(".vntCrd");

            card.classList.add("showInfo");
          });
        });

        document.querySelectorAll(".closeInf").forEach((closeBtn) => {
          closeBtn.addEventListener("click", (e) => {
            e.stopPropagation();

            const card = closeBtn.closest(".vntCrd");

            card.classList.remove("showInfo");
          });
        });

        document.querySelectorAll(".getTicketBtn").forEach((button) => {
          button.addEventListener("click", () => {
            window.location.href = `getTickets.html?id=${button.dataset.id}`;
          });
        });
      }

      document.addEventListener("click", (e) => {
        const openCard = document.querySelector(".vntCrd.showInfo");
        if (!openCard) return;

        const infoCont = openCard.querySelector(".infoCont");
        if (!infoCont.contains(e.target)) {
          openCard.classList.remove("showInfo");
        }
      });

      loadEvents();
    </script>
  </body>
</html>
