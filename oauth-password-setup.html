<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="images/facicon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Create Your Password | iVenue</title>
    <link rel="stylesheet" href="main.css" />
    <script src="loading-state.js"></script>
    <script defer src="public-header.js"></script>
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="auth-password-setup-page auth-verification-page">
    <header>
      <button
        class="auth-page-logo"
        id="oauthPasswordSetupLogo"
        type="button"
        aria-label="iVenue"
      >
        <img src="assets/ivenue-logo.png" alt="iVenue" />
      </button>
    </header>

    <main class="auth-page">
      <section class="auth-shell" aria-labelledby="password-setup-title">
        <p class="account-eyebrow">One final step</p>
        <h1 id="password-setup-title">Create your password</h1>
        <p class="auth-intro">
          Create an iVenue password so you can also sign in with your email and password.
        </p>

        <form class="auth-form" id="oauthPasswordSetupForm">
          <label>
            New password
            <input
              type="password"
              name="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </label>
          <label>
            Confirm password
            <input
              type="password"
              name="confirmPassword"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </label>
          <p class="password-hint">
            Use at least 8 characters with uppercase, lowercase, and a number.
          </p>
          <button class="auth-submit" type="submit">Create password</button>
        </form>

        <p class="auth-message" id="oauthPasswordSetupMessage" role="status"></p>
        <button class="auth-link-button" id="oauthPasswordSetupLogout" type="button">
          Log out
        </button>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script src="password-toggle.js"></script>
    <script src="oauth-password-setup.js"></script>
  </body>
</html>
