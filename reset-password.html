<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | The Launch</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html"><span>home</span></a>
        <a href="shows.html"><span>shows</span></a>
        <a href="venue.html"><span>venue</span></a>
        <a href="contact.html"><span>contact</span></a>
      </nav>
      <a class="contact" href="contact.html"><span>the launch</span></a>
    </header>

    <main class="auth-page">
      <section class="auth-shell" aria-labelledby="reset-title">
        <h1 id="reset-title">new password</h1>
        <p class="auth-intro">Choose a strong password for your account.</p>
        <form class="auth-form" id="resetForm" hidden>
          <label>
            New password
            <input
              type="password"
              name="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </label>
          <label>
            Confirm password
            <input
              type="password"
              name="confirmPassword"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </label>
          <button class="auth-submit" type="submit">Update password</button>
        </form>
        <p class="auth-message" id="authMessage" role="status">
          Checking recovery session...
        </p>
        <a class="auth-link" href="login.html">Back to login</a>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script>
      const form = document.querySelector("#resetForm");
      const message = document.querySelector("#authMessage");
      const submit = form.querySelector("button");
      let recoverySession = null;
      let recoveryEventReceived = false;

      function showError(text) {
        message.className = "auth-message error";
        message.textContent = text;
        form.hidden = true;
      }

      async function loadRecoverySession() {
        await new Promise((resolve) => setTimeout(resolve, 1000));
        const session = await window.authApi.getSession();
        if (!session?.user || !recoveryEventReceived) {
          showError(
            "This reset link is invalid or has expired. Request a new one.",
          );
          return;
        }
        form.hidden = false;
        message.className = "auth-message";
        message.textContent = "Recovery session verified.";
      }

      window.supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY" && session) {
          recoveryEventReceived = true;
          recoverySession = session;
          form.hidden = false;
          message.className = "auth-message";
          message.textContent = "Recovery session verified.";
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!recoverySession?.user) {
          showError("This reset session is no longer valid.");
          return;
        }

        const values = new FormData(form);
        const password = values.get("password");
        const passwordError = window.authApi.validatePassword(password);
        if (passwordError) {
          message.className = "auth-message error";
          message.textContent = passwordError;
          return;
        }
        if (password !== values.get("confirmPassword")) {
          message.className = "auth-message error";
          message.textContent = "Passwords must match.";
          return;
        }

        submit.disabled = true;
        message.className = "auth-message";
        message.textContent = "Updating password...";
        try {
          await window.authApi.updatePassword(password);
          message.className = "auth-message success";
          message.textContent =
            "Password updated. You can now log in normally.";
          form.reset();
          form.hidden = true;
          await window.authApi.signOut();
          window.location.href = "login.html?reset=success";
        } catch (error) {
          console.error(error);
          message.className = "auth-message error";
          message.textContent =
            "Unable to update password. Request a new reset link.";
          submit.disabled = false;
        }
      });

      loadRecoverySession().catch(() => {
        showError(
          "This reset link is invalid or has expired. Request a new one.",
        );
      });
    </script>
  </body>
</html>
