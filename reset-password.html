<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Recovery | The Launch</title>
    <link rel="stylesheet" href="main.css" />
    <script src="loading-state.js"></script>
    <script defer src="public-header.js"></script>
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <main class="auth-page">
      <a class="auth-page-logo" href="index.html" aria-label="iVenue home">
        <img src="assets/ivenue-logo.png" alt="iVenue" />
      </a>
      <section class="auth-shell" aria-labelledby="recovery-title">
        <h1 id="recovery-title">password recovery</h1>
        <p class="auth-intro">
          Choose a new password for your administrator account.
        </p>
        <form class="auth-form" id="resetForm" hidden>
          <label>
            New password
            <input
              type="password"
              name="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </label>
          <label>
            Confirm new password
            <input
              type="password"
              name="confirmPassword"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </label>
          <button class="auth-submit" type="submit">Change password</button>
        </form>
        <p class="auth-message" id="resetMessage" role="status">
          Checking recovery link...
        </p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script>
      const form = document.querySelector("#resetForm");
      const message = document.querySelector("#resetMessage");
      const submit = form.querySelector("button");
      const client = window.supabaseClient;

      async function verifyAdmin(userId) {
        const { data, error } = await client
          .from("admin_users")
          .select("user_id")
          .eq("user_id", userId)
          .maybeSingle();
        if (error) throw error;
        return Boolean(data);
      }

      function showError(text) {
        message.className = "auth-message error";
        message.textContent = text;
      }

      async function showRecoveryForm(session) {
        if (!session?.user || !(await verifyAdmin(session.user.id))) {
          showError("This administrator recovery link is invalid or expired.");
          return;
        }
        form.hidden = false;
        message.className = "auth-message success";
        message.textContent = "Recovery link verified. Choose a new password.";
      }

      client.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") {
          showRecoveryForm(session).catch(() =>
            showError("Unable to verify the recovery link."),
          );
        }
      });

      setTimeout(async () => {
        try {
          await showRecoveryForm(await window.authApi.getSession());
        } catch {
          showError("This administrator recovery link is invalid or expired.");
        }
      }, 800);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const values = new FormData(form);
        const password = values.get("password");
        const validationError = window.authApi.validatePassword(password);
        if (validationError) return showError(validationError);
        if (password !== values.get("confirmPassword"))
          return showError("Passwords must match.");
        submit.disabled = true;
        message.className = "auth-message";
        message.textContent = "Changing password...";
        try {
          const session = await window.authApi.getSession();
          if (!session?.user || !(await verifyAdmin(session.user.id)))
            throw new Error("Recovery session is no longer valid.");
          await window.authApi.updatePassword(password);
          await window.authApi.signOut();
          message.className = "auth-message success";
          message.textContent =
            "Password changed successfully. You can now log in through Admin Login.";
          form.reset();
          form.hidden = true;
        } catch (error) {
          showError(error.message || "Unable to change the password.");
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
