<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account | The Launch</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html"><span>home</span></a>
        <a href="shows.html"><span>shows</span></a>
        <a href="venue.html"><span>venue</span></a>
        <a href="contact.html"><span>contact</span></a>
      </nav>
      <a class="contact" href="contact.html"><span>the launch</span></a>
    </header>

    <main class="auth-page">
      <section class="auth-shell" aria-labelledby="account-title">
        <h1 id="account-title">account</h1>
        <p class="auth-intro" id="accountStatus">Loading your account...</p>

        <form class="auth-form" id="profileForm" hidden>
          <label>First name <input name="firstName" required /></label>
          <label>Last name <input name="lastName" required /></label>
          <label>Email <input name="email" type="email" readonly /></label>
          <label>Phone <input name="phone" type="tel" /></label>
          <label>Avatar URL <input name="avatarUrl" type="url" /></label>
          <button class="auth-submit" type="submit">Save profile</button>
        </form>

        <p class="auth-message" id="profileMessage" role="status"></p>
        <form class="auth-form" id="securityForm" hidden>
          <label
            >New password
            <input
              name="password"
              type="password"
              minlength="8"
              autocomplete="new-password"
              required
          /></label>
          <button class="auth-submit" type="submit">Change password</button>
        </form>
        <form class="auth-form" id="emailForm" hidden>
          <label
            >New authentication email
            <input name="email" type="email" required autocomplete="email"
          /></label>
          <button class="auth-submit" type="submit">Change email</button>
        </form>
        <button class="auth-danger" id="deleteAccount" type="button">
          Delete account
        </button>
        <p class="auth-message" id="deleteMessage" role="status"></p>
        <div class="auth-link" id="ordersHeading">Recent orders</div>
        <div id="ordersList" class="auth-intro">Loading orders...</div>
        <div class="auth-link">Your cart</div>
        <div id="cartList" class="auth-intro">Loading cart...</div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script src="auth-ui.js"></script>
    <script src="cart-sync.js"></script>
    <script src="account.js"></script>
  </body>
</html>
